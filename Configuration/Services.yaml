services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maispace\MaiSearch\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      - '../Classes/Domain/Dto/*'

  Maispace\MaiSearch\Service\IndexerRegistry:
    public: true
    tags:
      - name: 'maispace.search.indexer_registry'

  Maispace\MaiSearch\Service\ResultFormatterRegistry:
    public: true
    tags:
      - name: 'maispace.search.formatter_registry'

  Maispace\MaiSearch\Service\BackendRegistry:
    public: true
    tags:
      - name: 'maispace.search.backend_registry'

  Maispace\MaiSearch\Facet\FacetRegistry:
    public: true
    tags:
      - name: 'maispace.search.facet_registry'

  # Declares the one facet field backends currently support (SPEC-v2.md Phase 6).
  # Empty values/activeValues: this is a declaration, not a per-query result —
  # SolrBackend/MeilisearchBackend build a freshly-hydrated TypeFacet per search
  # from FacetRegistry::getAllFacets(), reading only getName()/getLabel() here.
  Maispace\MaiSearch\Facet\TypeFacet:
    arguments:
      $name: 'type'
      $label: 'Type'
    tags:
      - name: 'maispace.search.facet_field'

  Maispace\MaiSearch\Backend\Solr\SolrBackend:
    tags:
      - name: 'maispace.search.backend'

  Maispace\MaiSearch\Backend\IndexedSearch\IndexedSearchBackend:
    tags:
      - name: 'maispace.search.backend'

  Maispace\MaiSearch\Backend\Meilisearch\MeilisearchBackend:
    tags:
      - name: 'maispace.search.backend'

  Maispace\MaiSearch\Service\SuggestRegistry:
    public: true
    tags:
      - name: 'maispace.search.suggest_registry'

  Maispace\MaiSearch\Suggest\SolrSuggest:
    tags:
      - name: 'maispace.search.suggest'

  Maispace\MaiSearch\Suggest\MeilisearchSuggest:
    tags:
      - name: 'maispace.search.suggest'

  Maispace\MaiSearch\Suggest\IndexedSearchSuggest:
    tags:
      - name: 'maispace.search.suggest'

  # Resolves to whichever backend is currently active (SuggestRegistry mirrors
  # BackendRegistry's own activeBackend lookup) rather than Symfony's "only one
  # implementation exists" auto-wiring rule, which stops working the moment a
  # second SuggestInterface implementation exists — same lesson already applied
  # to RerankerInterface below.
  Maispace\MaiSearch\Suggest\SuggestInterface:
    factory: ['@Maispace\MaiSearch\Service\SuggestRegistry', 'getActive']

  Maispace\MaiSearch\Service\ProviderRegistry:
    public: true

  Maispace\MaiSearch\Service\ProviderAvailabilityService:
    public: true

  Maispace\MaiSearch\Extraction\ExtractorRegistry:
    public: true

  Maispace\MaiSearch\Service\AnswerCacheService:
    arguments:
      $cache: '@cache.maisearch_answer'

  # Explicit alias so resolution doesn't depend on Symfony's "only one
  # implementation exists" auto-wiring rule, which vanishes the moment a
  # second RerankerInterface implementation is added (see .lookup/smart-search's
  # own documented lesson on this exact point, SPEC-v2.md Phase 7 addendum).
  Maispace\MaiSearch\Reranking\RerankerInterface:
    alias: Maispace\MaiSearch\Reranking\LlmReranker

  # Providers are built from Extension Configuration via ProviderFactory rather
  # than autowired directly, so their constructor args (API keys, base URLs,
  # models) stay out of the DI graph.
  Maispace\MaiSearch\Provider\Embedding\OpenAiEmbeddingProvider:
    factory: ['@Maispace\MaiSearch\Service\ProviderFactory', 'createOpenAiEmbeddingProvider']
    tags:
      - name: 'maispace.search.embedding_provider'

  Maispace\MaiSearch\Provider\Embedding\OllamaEmbeddingProvider:
    factory: ['@Maispace\MaiSearch\Service\ProviderFactory', 'createOllamaEmbeddingProvider']
    tags:
      - name: 'maispace.search.embedding_provider'

  Maispace\MaiSearch\Provider\Embedding\CustomEmbeddingProvider:
    factory: ['@Maispace\MaiSearch\Service\ProviderFactory', 'createCustomEmbeddingProvider']
    tags:
      - name: 'maispace.search.embedding_provider'

  Maispace\MaiSearch\Provider\Chat\OpenAiChatProvider:
    factory: ['@Maispace\MaiSearch\Service\ProviderFactory', 'createOpenAiChatProvider']
    tags:
      - name: 'maispace.search.chat_provider'

  Maispace\MaiSearch\Provider\Chat\OllamaChatProvider:
    factory: ['@Maispace\MaiSearch\Service\ProviderFactory', 'createOllamaChatProvider']
    tags:
      - name: 'maispace.search.chat_provider'

  Maispace\MaiSearch\Provider\Chat\CustomChatProvider:
    factory: ['@Maispace\MaiSearch\Service\ProviderFactory', 'createCustomChatProvider']
    tags:
      - name: 'maispace.search.chat_provider'

  Maispace\MaiSearch\Indexer\PageIndexer:
    tags:
      - name: 'maispace.search.indexer'
      - name: 'maispace.search.result_formatter'

  Maispace\MaiSearch\Controller\SearchController:
    public: true

  Maispace\MaiSearch\Controller\Backend\SearchBackendController:
    public: true

  Maispace\MaiSearch\Scheduler\FullReindexTask:
    public: true

  Maispace\MaiSearch\Scheduler\IndexQueueProcessingTask:
    public: true

  # DataHandler instantiates hooks via GeneralUtility::makeInstance() — must be public for DI
  Maispace\MaiSearch\Hook\DataHandlerHook:
    public: true

  dashboard.widget.solr_health:
    class: 'Maispace\MaiSearch\Widget\SolrHealthWidget'
    tags:
      - name: dashboard.widget
        identifier: 'solrHealth'
        groupNames: 'systemInfo'
        title: 'LLL:EXT:mai_search/Resources/Private/Language/locallang_dashboard.xlf:widgets.solrHealth.title'
        description: 'LLL:EXT:mai_search/Resources/Private/Language/locallang_dashboard.xlf:widgets.solrHealth.description'
        iconIdentifier: 'content-widget-list'
        height: 'medium'
        width: 'medium'
