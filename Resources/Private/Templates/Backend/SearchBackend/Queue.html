<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <div class="module-body">
        <h1><f:translate key="LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.title" /></h1>

        <div class="row" style="margin-bottom: 2em;">
            <div class="col-md-3">
                <div class="panel panel-default">
                    <div class="panel-body text-center">
                        <h2>{counts.pending}</h2>
                        <span class="label label-warning">
                            <f:translate key="LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.pending" />
                        </span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="panel panel-default">
                    <div class="panel-body text-center">
                        <h2>{counts.processing}</h2>
                        <span class="label label-info">
                            <f:translate key="LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.processing" />
                        </span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="panel panel-default">
                    <div class="panel-body text-center">
                        <h2>{counts.done}</h2>
                        <span class="label label-success">
                            <f:translate key="LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.done" />
                        </span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="panel panel-default">
                    <div class="panel-body text-center">
                        <h2>{counts.failed}</h2>
                        <span class="label label-danger">
                            <f:translate key="LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.failed" />
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <div style="margin-bottom: 2em;">
            <f:link.action action="processQueue" class="btn btn-primary"
                           title="{f:translate(key: 'LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.process.title')}">
                <core:icon identifier="actions-play" />
                <f:translate key="LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.process.button" />
            </f:link.action>

            <f:link.action action="index" class="btn btn-default" style="margin-left: 0.5em;">
                <core:icon identifier="actions-view-go-back" />
                <f:translate key="LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.back" />
            </f:link.action>
        </div>

        <h2><f:translate key="LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.recent.title" /></h2>

        <f:if condition="{jobs}">
            <f:then>
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th><f:translate key="LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.recent.table" /></th>
                            <th><f:translate key="LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.recent.recordUid" /></th>
                            <th><f:translate key="LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.recent.operation" /></th>
                            <th><f:translate key="LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.recent.status" /></th>
                            <th><f:translate key="LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.recent.queuedDate" /></th>
                            <th><f:translate key="LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.recent.processedDate" /></th>
                            <th><f:translate key="LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.recent.error" /></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{jobs}" as="job">
                            <tr>
                                <td><code>{job.tableName}</code></td>
                                <td>{job.recordUid}</td>
                                <td><span class="label label-default">{job.operation}</span></td>
                                <td>
                                    <f:switch expression="{job.status}">
                                        <f:case value="pending"><span class="label label-warning">{job.status}</span></f:case>
                                        <f:case value="processing"><span class="label label-info">{job.status}</span></f:case>
                                        <f:case value="done"><span class="label label-success">{job.status}</span></f:case>
                                        <f:case value="failed"><span class="label label-danger">{job.status}</span></f:case>
                                        <f:defaultCase><span class="label label-default">{job.status}</span></f:defaultCase>
                                    </f:switch>
                                </td>
                                <td>{job.queuedDate}</td>
                                <td>{job.processedDate}</td>
                                <td>{job.errorMessage}</td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </f:then>
            <f:else>
                <div class="alert alert-info">
                    <f:translate key="LLL:EXT:mai_search/Resources/Private/Language/Default/locallang_backend.xlf:queue.recent.noData" />
                </div>
            </f:else>
        </f:if>
    </div>
</f:section>
</html>
